server:
  port: 8080

spring:
  application:
    name: springai-ollama-demo
  
  datasource:
    url: jdbc:postgresql://localhost:5432/vectordb
    username: vectordb
    password: vectordb
    driver-class-name: org.postgresql.Driver
    
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: when_missing
      chat:
        model: llama3.2
        options:
          temperature: 0.7
      embedding:
        model: nomic-embed-text
    
    vectorstore:
      pgvector:
        # nomic-embed-text produces 768-dimensional vectors
        dimensions: 768
        initialize-schema: true
        index-type: hnsw
        distance-type: cosine_distance
        # how many chunks are retrieved and injected as context per question
        top-k: 4
        # only chunks at least this similar to the question are used
        similarity-threshold: 0.5

# Custom settings for the RAG document ingestion (doc-rag folder)
app:
  rag:
    # folder containing the .txt files that are embedded and prioritized
    # over the model's own knowledge
    docs-path: ./doc-rag
    chunk-size: 800
    
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    br.com.joaofelipefaria.ai.springai: DEBUG
